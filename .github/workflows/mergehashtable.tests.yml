name: MergeHashtable Pester Tests

on:
  push:
    branches:
      - dev
    paths:
      - 'MergeHashtable/**.ps1'
      - 'MergeHashtable/**.psm1'
      - 'MergePSCustomObject/**.ps1'
      - 'MergePSCustomObject/**.psm1'

  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        shell: [ pwsh ]
        include:
          - os: windows-latest
            shell: powershell

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      # No PSGallery setup needed -- Merge-Hashtable.Tests.ps1 imports the sibling
      # MergePSCustomObject module from this same checkout, not from PSGallery

      - name: Run Pester Tests (powershell on ${{ matrix.os }})
        if: matrix.shell == 'powershell'
        env:
          CI: true
        shell: powershell
        run: Invoke-Pester -Path MergeHashtable/Test/ -Output Detailed -Passthru

      - name: Run Pester Tests (pwsh on ${{ matrix.os }})
        if: matrix.shell != 'powershell'
        env:
          CI: true
        shell: pwsh
        run: Invoke-Pester -Path MergeHashtable/Test/ -Output Detailed -Passthru
